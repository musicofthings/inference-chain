name: Release

# Publishes to npm when a v* tag is pushed:
#   pnpm version <patch|minor|major> && git push --follow-tags
#
# Authenticates with npm trusted publishing (OIDC) — there is no NPM_TOKEN
# secret to leak or rotate. The trusted publisher registered on npmjs.com is
# pinned to this repository *and this filename*, so renaming this file silently
# breaks releases until the publisher config is updated to match.
on:
  push:
    tags: ["v*"]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Mints the OIDC token npm exchanges for a short-lived publish credential.
      # Also what lets npm attach a provenance attestation.
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          # Trusted publishing requires >= 22.14, and 22 is a version CI already
          # exercises — so better-sqlite3 is known to build here.
          node-version: 22
          # No registry-url on purpose. It makes setup-node write an .npmrc with
          # _authToken=${NODE_AUTH_TOKEN} and export a literal
          # "XXXXX-XXXXX-XXXXX-XXXXX" placeholder when no token is supplied.
          # npm then prefers that bogus credential over OIDC, publishes as
          # nobody, and the registry answers 404. registry.npmjs.org is the
          # default anyway, so this costs nothing.
          #
          # Also deliberately no dependency cache: a release build should
          # resolve from the registry rather than trust a restored cache.

      # Node 22 bundles npm 10.x; OIDC publishing landed in npm 11.5.1. Printed
      # because an outdated npm fails as a confusing ENEEDAUTH at the last step.
      - name: npm new enough for OIDC
        run: |
          npm install -g npm@latest
          npm --version

      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm build
      - run: pnpm test
      - run: pnpm eval:e2e
      - name: n+1 sharpness regression
        run: pnpm eval:sim

      - name: tag matches package.json version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg=$(node -p "require('./package.json').version")
          if [ "$tag" != "$pkg" ]; then
            echo "tag $tag does not match package.json version $pkg" >&2
            exit 1
          fi

      # npm prefers a configured credential over OIDC, so anything that leaves
      # one behind turns into an opaque "404 Not Found - PUT" at publish time.
      # Fail loudly here instead. Never echo the value.
      - name: nothing shadowing OIDC auth
        run: |
          if [ -n "${NODE_AUTH_TOKEN:-}" ]; then
            echo "NODE_AUTH_TOKEN is set; npm would use it instead of OIDC" >&2
            exit 1
          fi

      # No --provenance and no NODE_AUTH_TOKEN: under trusted publishing npm
      # detects the OIDC environment itself and signs provenance by default.
      - run: npm publish
